name: ZAP API Scan

on:
  pull_request

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    name: Run ZAP Analysis
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build application
        run: ./gradlew build -x test

      - name: Start application
        run: |
          ./gradlew bootRun &
          echo $! > app.pid
          # Wait for application to start
          for i in {1..30}; do
            if curl -s http://localhost:8081/v3/api-docs > /dev/null; then
              echo "Application is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Run ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          format: 'openapi'
          target: 'http://localhost:8081/v3/api-docs'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-T 15 -z "-config scanner.targetParamsInjectable=31 -config scanner.targetParamsEnabledRPC=5 -config scanner.strength=INSANE"'
          fail_action: false
          allow_issue_writing: false

      - name: Stop application
        if: always()
        run: |
          if [ -f app.pid ]; then
            kill $(cat app.pid) || true
          fi
